<text x="68.0" y="627.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Deterministic sampling needs two more settings (README.md:28)</text>
