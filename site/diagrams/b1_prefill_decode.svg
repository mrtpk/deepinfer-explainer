<text x="30.0" y="812.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">TTFT = time to first token. TBT = time between tokens. Both are latency targets for a serving system.</text>
<text x="30.0" y="830.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">DeepInfer: prepare_sample.cpp:61 rejects mixed batches; model_runner.py:182 uses CUDA graphs only for decode.</text>
<text x="30.0" y="848.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">With draft tokens (default 5), a DeepInfer decode step sends up to 1 + 5 = 6 tokens per sequence (mtp_varlen.hpp:153-157).</text>
