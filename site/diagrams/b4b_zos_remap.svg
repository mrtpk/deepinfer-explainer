<text x="56.0" y="494.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  2  C      35 + 6 + 6 =  47    41     0             41 + 6 - 5 =  42</text>
<text x="56.0" y="516.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">3-8  pad                         1     -              1   (the kernel gets only rows 0-2)</text>
