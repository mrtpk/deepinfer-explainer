<text x="56.0" y="424.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">  i  seq   CPU seqlen_k        sent k  accepted(N)  device k = sent + 6 - (5 - acc)</text>
<text x="56.0" y="450.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  0  A     100 + 6 + 6 = 112   106     2            106 + 6 - 3 = 109</text>
