<text x="1046.0" y="470.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">out</text>
<rect x="110.0" y="396.0" width="380.0" height="54.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="126.0" y="418.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">RMSNorm  →  Attention</text>
<text x="126.0" y="438.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">tokens look at earlier tokens</text>
<rect x="590.0" y="396.0" width="380.0" height="54.0" rx="8" fill="#fdf2f8" fill-opacity="1.0" stroke="#db2777" stroke-width="1.5"/>
<text x="606.0" y="418.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#db2777" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">RMSNorm  →  Feed-forward (MLP)</text>
<text x="606.0" y="438.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">each token alone: [d] → [d]</text>
