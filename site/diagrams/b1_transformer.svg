<text x="68.0" y="579.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">What does DeepSeek V4.1 change in DeepInfer?</text>
<text x="68.0" y="598.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The same skeleton, with three changes. Each one has its own concept page.</text>
<rect x="46.0" y="618.0" width="300.0" height="100.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="196.0" y="638.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">MLA attention</text>
<text x="196.0" y="662.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">one shared KV head</text>
<text x="196.0" y="682.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">512 numbers per entry</text>
<text x="196.0" y="702.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">compressed KV cache</text>
<rect x="400.0" y="618.0" width="300.0" height="100.0" rx="8" fill="#fdf2f8" fill-opacity="1.0" stroke="#db2777" stroke-width="1.5"/>
<text x="550.0" y="638.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#db2777" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">MoE feed-forward</text>
<text x="550.0" y="662.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">a gate picks a few</text>
<text x="550.0" y="682.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">routed experts per token,</text>
<text x="550.0" y="702.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">plus a shared expert</text>
<rect x="754.0" y="618.0" width="300.0" height="100.0" rx="8" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.5"/>
<text x="904.0" y="638.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">mHC residual</text>
<text x="904.0" y="662.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">the residual stream has</text>
<text x="904.0" y="682.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">hc_mult paths</text>
<text x="904.0" y="702.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">[T, hc_mult, d]</text>
<text x="30.0" y="777.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
