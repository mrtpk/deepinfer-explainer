<rect x="425.7" y="766.0" width="14.0" height="14.0" rx="3" fill="#fdf2f8" fill-opacity="1.0" stroke="#db2777" stroke-width="1.4"/>
<text x="446.7" y="777.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">feed-forward / MoE</text>
<rect x="590.6" y="766.0" width="14.0" height="14.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.4"/>
<text x="611.6" y="777.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">output head</text>
<text x="30.0" y="802.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">In DeepInfer, the model forward returns hidden states. The sampler computes the logits, only for the rows it samples.</text>
<text x="30.0" y="820.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Panel 3 sources: cache_engine.py:624 (1 KV head), cache_common.py:109-111 (512), moe.py:1-8, hc.py:1-4 and 58.</text>
<text x="30.0" y="838.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Not shown: positions (RoPE), the KV cache, sparse attention, Engram, and the split of work over devices.</text>
