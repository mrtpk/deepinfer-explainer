<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="864" viewBox="0 0 1100 864">
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker></defs>
<rect width="1100" height="864" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Inside a transformer: from token ids to logits</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Decoder-only model  ·  T = tokens in the step, d = hidden size, V = vocabulary size  ·  pre-norm layers</text>
<rect x="20.0" y="92.0" width="1060.0" height="214.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="118.0" r="13" fill="#111827"/>
<text x="46.0" y="122.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="123.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">What does the model do with the ids?</text>
<text x="68.0" y="142.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Embedding, then N decoder layers, then a final norm and the LM head. The shape stays [T, d] between layers.</text>
<rect x="46.0" y="168.0" width="300.0" height="112.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="196.0" y="188.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">Embedding</text>
<text x="196.0" y="214.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">look up one row per id</text>
<text x="196.0" y="235.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">ids int [T]</text>
<text x="196.0" y="256.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">→ hidden [T, d]</text>
<rect x="400.0" y="168.0" width="300.0" height="112.0" rx="8" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.5"/>
<text x="550.0" y="188.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">N × decoder layer</text>
<text x="550.0" y="214.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">attention + feed-forward</text>
<text x="550.0" y="235.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">[T, d] → [T, d]</text>
<text x="550.0" y="256.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">same shape, new content</text>
<rect x="754.0" y="168.0" width="300.0" height="112.0" rx="8" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.5"/>
<text x="904.0" y="188.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">Final norm + LM head</text>
<text x="904.0" y="214.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">one score per vocab token</text>
<text x="904.0" y="235.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">[T, d] × [d, V]</text>
<text x="904.0" y="256.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">→ logits [T, V]</text>
