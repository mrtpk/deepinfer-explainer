<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="870" viewBox="0 0 1100 870">
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="1100" height="870" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">From text to token ids</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Panel 1 ids are illustrative (only BOS = 0 is real)  ·  panel 2 is a toy BPE run  ·  panel 3 is DeepInfer&#x27;s real policy</text>
<rect x="20.0" y="92.0" width="1060.0" height="196.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="118.0" r="13" fill="#111827"/>
<text x="46.0" y="122.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="123.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">How does text become ids?</text>
<text x="68.0" y="142.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The tokenizer cuts the text into known pieces. Each piece has one integer id. DeepInfer puts BOS (id 0) first.</text>
<rect x="46.0" y="164.0" width="250.0" height="40.0" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#111827" stroke-width="1.3"/>
<text x="171.0" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">&quot;Tokenization isn&#x27;t hard.&quot;</text>
<line x1="298.0" y1="184.0" x2="334.0" y2="184.0" stroke="#111827" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="338.0" y="164.0" width="43.5" height="40.0" rx="6" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.3"/>
<text x="359.7" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">BOS</text>
<text x="359.7" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">0</text>
<rect x="389.5" y="164.0" width="59.1" height="40.0" rx="6" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.3"/>
<text x="419.0" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">Token</text>
<text x="419.0" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">15400</text>
<rect x="456.6" y="164.0" width="74.8" height="40.0" rx="6" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.3"/>
<text x="494.0" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">ization</text>
<text x="494.0" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2860</text>
<rect x="539.4" y="164.0" width="51.3" height="40.0" rx="6" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.3"/>
<text x="565.0" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">␣isn</text>
<text x="565.0" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">4568</text>
<rect x="598.7" y="164.0" width="42.6" height="40.0" rx="6" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.3"/>
<text x="620.0" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">&#x27;t</text>
<text x="620.0" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">498</text>
<rect x="649.3" y="164.0" width="59.1" height="40.0" rx="6" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.3"/>
<text x="678.8" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">␣hard</text>
<text x="678.8" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">3245</text>
<rect x="716.4" y="164.0" width="35.0" height="40.0" rx="6" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.3"/>
<text x="733.9" y="189.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">.</text>
<text x="733.9" y="226.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#2563eb" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">16</text>
<text x="338.0" y="254.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre" font-style="italic">␣ = a space. A space usually belongs to the next piece. Common words are one piece; rare words are several.</text>
<rect x="20.0" y="308.0" width="1060.0" height="226.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="334.0" r="13" fill="#111827"/>
<text x="46.0" y="338.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="339.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">How does BPE learn its pieces?</text>
<text x="68.0" y="358.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Training repeats one rule: merge the most frequent pair of neighbours into a new piece.</text>
<text x="46.0" y="400.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">start</text>
<rect x="140.0" y="384.0" width="470.0" height="26.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="152.0" y="402.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">l o w ␣ l o w e r ␣ l o w e s t</text>
<text x="630.0" y="402.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">single characters</text>
<text x="46.0" y="434.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">merge 1</text>
<rect x="140.0" y="418.0" width="470.0" height="26.0" rx="6" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.2"/>
<text x="152.0" y="436.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">lo w ␣ lo w e r ␣ lo w e s t</text>
<text x="630.0" y="436.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">pair (l, o) is most frequent: 3 times</text>
<text x="46.0" y="468.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">merge 2</text>
<rect x="140.0" y="452.0" width="470.0" height="26.0" rx="6" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.2"/>
<text x="152.0" y="470.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">low ␣ low e r ␣ low e s t</text>
<text x="630.0" y="470.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">pair (lo, w): 3 times</text>
<text x="46.0" y="502.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">merge 3</text>
<rect x="140.0" y="486.0" width="470.0" height="26.0" rx="6" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.2"/>
<text x="152.0" y="504.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">low ␣ lowe r ␣ lowe s t</text>
<text x="630.0" y="504.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">pair (low, e): 2 times</text>
<rect x="20.0" y="554.0" width="1060.0" height="196.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="580.0" r="13" fill="#111827"/>
<text x="46.0" y="584.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">3</text>
<text x="68.0" y="585.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Which ids are special in DeepInfer?</text>
<text x="68.0" y="604.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The default release policy checks these ids. If one is wrong, get_hf_tokenizer stops with ValueError.</text>
<rect x="46.0" y="624.0" width="318.0" height="76.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="205.0" y="644.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">BOS  ·  id 0</text>
<text x="205.0" y="666.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">&lt;|begin▁of▁sentence|&gt;</text>
<text x="205.0" y="685.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">added first by encode()</text>
<rect x="391.0" y="624.0" width="318.0" height="76.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="550.0" y="644.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">EOS  ·  id 1</text>
<text x="550.0" y="666.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">&lt;|end▁of▁sentence|&gt;</text>
<text x="550.0" y="685.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">the model writes it to stop</text>
<rect x="736.0" y="624.0" width="318.0" height="76.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="895.0" y="644.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">PAD  ·  id 2</text>
<text x="895.0" y="666.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">&lt;|▁pad▁|&gt;</text>
<text x="895.0" y="685.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">marks padding</text>
<text x="46.0" y="730.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Also reserved: 21 multimodal placeholder tokens at ids 129280-129300 (tokenizer.py:25-30, 48-56).</text>
<text x="30.0" y="783.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="772.0" width="14.0" height="14.0" rx="3" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/>
<text x="118.3" y="783.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">text piece</text>
<rect x="202.4" y="772.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="223.4" y="783.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">special token</text>
<rect x="323.8" y="772.0" width="14.0" height="14.0" rx="3" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="344.8" y="783.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">new piece from a BPE merge</text>
<text x="30.0" y="808.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Panel 1: the pieces and ids are made up to show the idea. A real tokenizer can cut the text in other places.</text>
<text x="30.0" y="826.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Panel 2: a real byte-level BPE starts from bytes, learns many thousands of merges, and keeps the merge list in tokenizer.json.</text>
<text x="30.0" y="844.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Panel 3: the real token names use the full-width bar U+FF5C, shown here as |.</text>
</svg>
