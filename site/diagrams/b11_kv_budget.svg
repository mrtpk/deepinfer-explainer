<line x1="682.3" y1="208.0" x2="682.3" y2="196.0" stroke="#d97706" stroke-width="1.2"/>
<text x="682.3" y="190.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d97706" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2 x state = 1 GiB (store + copy buffer)</text>
