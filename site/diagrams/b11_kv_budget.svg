<rect x="676.0" y="212.0" width="12.6" height="46.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.3"/>
<rect x="688.6" y="212.0" width="214.2" height="46.0" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="795.7" y="239.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">KV blocks: 17 GiB</text>
<rect x="902.8" y="212.0" width="151.2" height="46.0" rx="3" fill="#e5e7eb" fill-opacity="1.0" stroke="#9ca3af" stroke-width="1.3"/>
