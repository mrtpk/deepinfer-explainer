<text x="46.0" y="280.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">0 GiB</text>
<line x1="676.0" y1="258.0" x2="676.0" y2="266.0" stroke="#6b7280" stroke-width="1"/>
<text x="676.0" y="280.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">50 GiB</text>
<line x1="902.8" y1="258.0" x2="902.8" y2="266.0" stroke="#6b7280" stroke-width="1"/>
<text x="902.8" y="280.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">68 GiB</text>
<line x1="1054.0" y1="258.0" x2="1054.0" y2="266.0" stroke="#6b7280" stroke-width="1"/>
<text x="1054.0" y="280.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="end" xml:space="preserve" style="white-space:pre">80 GiB</text>
<text x="902.8" y="296.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="middle" xml:space="preserve" style="white-space:pre">80 x 0.85 = 68 GiB</text>
<text x="46.0" y="320.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">peak   = max_memory_allocated (profile run) + non-torch memory    base.py:228-234</text>
<text x="46.0" y="337.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">budget = total * gpu_memory_utilization - peak - 2 * state_size   base.py:235-244</text>
<text x="46.0" y="354.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">blocks = max(int(budget // bytes_per_block), 0)                   base.py:245-246</text>
<rect x="20.0" y="400.0" width="1060.0" height="222.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
