<text x="501.7" y="655.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">per-rank measurement</text>
<text x="30.0" y="682.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">All GiB values are invented for the example. The real peak depends on the checkpoint and on the profile batch.</text>
<text x="30.0" y="700.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The docstring of _init_cache says &#x27;minimum&#x27; (llm_engine.py:426-428); the code takes the mean (base.py:264-266).</text>
