<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">V4.1 checkpoint with the default config  ·  every scale is a power of two (UE8M0) except the FP4 main KV</text>
