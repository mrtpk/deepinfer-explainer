<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="758" viewBox="0 0 1100 758">
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="1100" height="758" fill="#ffffff"/>
<text x="30.0" y="42.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Inside the vision encoder: ViT, downsample, projector</text>
<text x="30.0" y="68.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">VisionTransformer (vit.py) and MlpProjector (mlp_projector.py)  ·  shapes for one 640x480 image</text>
<text x="30.0" y="88.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">patch 14  ·  dim 1024  ·  32 blocks  ·  16 heads x 64  ·  MLP 2816  ·  r = 3 (example)  ·  H = LLM hidden size</text>
<rect x="20.0" y="112.0" width="1060.0" height="268.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="138.0" r="13" fill="#111827"/>
<text x="46.0" y="142.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="68.0" y="143.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">What does the ViT compute for each patch?</text>
<text x="68.0" y="162.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">A flat linear patch embedding, then 32 pre-norm blocks with 2-D RoPE. Patches see only their own image.</text>
<rect x="46.0" y="184.0" width="300.0" height="132.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="60.0" y="208.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Patch embedding</text>
<text x="60.0" y="232.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">in  [1610, 3, 14, 14] bf16</text>
<text x="60.0" y="250.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Linear 588 -&gt; 1024</text>
<text x="60.0" y="268.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">out [1610, 1024]</text>
<text x="60.0" y="286.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">vit.py:69-76</text>
<rect x="400.0" y="184.0" width="300.0" height="132.0" rx="8" fill="#f0fdfa" fill-opacity="1.0" stroke="#0d9488" stroke-width="2"/>
<text x="414.0" y="208.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#0d9488" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Block x 32</text>
<text x="414.0" y="232.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">RMSNorm -&gt; Attention</text>
<text x="414.0" y="250.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  qkv 1024 -&gt; 3072, 16 x 64</text>
<text x="414.0" y="268.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">RMSNorm -&gt; SwiGLU</text>
<text x="414.0" y="286.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  1024 -&gt; 2 x 2816 -&gt; 1024</text>
<rect x="754.0" y="184.0" width="300.0" height="132.0" rx="8" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/>
<text x="768.0" y="208.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">fc_norm</text>
<text x="768.0" y="232.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">RMSNorm, eps 1e-6</text>
<text x="768.0" y="250.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">out [1610, 1024]</text>
<text x="768.0" y="268.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">one row per patch</text>
<text x="768.0" y="286.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">vit.py:230</text>
<line x1="346.0" y1="250.0" x2="398.0" y2="250.0" stroke="#111827" stroke-width="1.6" marker-end="url(#m0)"/>
<line x1="700.0" y1="250.0" x2="752.0" y2="250.0" stroke="#111827" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="46.0" y="342.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Attention: cu_seqlens_vit splits the batch per image, causal=False (vit.py:107-122). RoPE position = (row, column) of the patch.</text>
<text x="46.0" y="360.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Every 2nd block adds the residual itself; the others leave it to the next RMSNorm kernel (vit.py:189, config.py:223).</text>
<rect x="20.0" y="400.0" width="1060.0" height="234.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="46.0" cy="426.0" r="13" fill="#111827"/>
<text x="46.0" y="430.9" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="68.0" y="431.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">How do 1610 patches become 192 LLM vectors?</text>
<text x="68.0" y="450.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Each 3 x 3 block of patches is joined into one long row; a 2-layer MLP maps it to the LLM width.</text>
<rect x="46.0" y="472.0" width="300.0" height="132.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="60.0" y="496.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Patch grid</text>
<text x="60.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">35 rows x 46 columns</text>
<text x="60.0" y="538.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">pad to 36 x 48 with zeros</text>
<text x="60.0" y="556.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">(multiple of r = 3)</text>
<text x="60.0" y="574.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">image_embed_ops.py:573-576</text>
<rect x="400.0" y="472.0" width="300.0" height="132.0" rx="8" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="414.0" y="496.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#d97706" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">batch_downsample</text>
<text x="414.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">3 x 3 blocks: 12 x 16 = 192</text>
<text x="414.0" y="538.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">concat channels:</text>
<text x="414.0" y="556.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">  [192, 1024 * 9 = 9216]</text>
<text x="414.0" y="574.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">mode downsample_mlp_gelu</text>
<rect x="754.0" y="472.0" width="300.0" height="132.0" rx="8" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="2"/>
<text x="768.0" y="496.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">MlpProjector (depth 2)</text>
<text x="768.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Linear 9216 -&gt; H</text>
<text x="768.0" y="538.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">GELU</text>
<text x="768.0" y="556.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">Linear H -&gt; H</text>
<text x="768.0" y="574.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">out [192, H] = image tokens</text>
<line x1="346.0" y1="538.0" x2="398.0" y2="538.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#m1)"/>
<line x1="700.0" y1="538.0" x2="752.0" y2="538.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="30.0" y="667.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Legend</text>
<rect x="97.3" y="656.0" width="14.0" height="14.0" rx="3" fill="#eff6ff" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.4"/>
<text x="118.3" y="667.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">per-patch layers</text>
<rect x="240.6" y="656.0" width="14.0" height="14.0" rx="3" fill="#f0fdfa" fill-opacity="1.0" stroke="#0d9488" stroke-width="1.4"/>
<text x="261.6" y="667.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">transformer blocks</text>
<rect x="400.4" y="656.0" width="14.0" height="14.0" rx="3" fill="#fffbeb" fill-opacity="1.0" stroke="#d97706" stroke-width="1.4"/>
<text x="421.4" y="667.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">downsample</text>
<rect x="515.9" y="656.0" width="14.0" height="14.0" rx="3" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="536.9" y="667.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">projector</text>
<text x="30.0" y="694.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">flash-attn, DeepGEMM and tile_kernels are not in this repo. The TileLang image kernels are (tilelang_ops/cuda|asc/image_embed_ops.py).</text>
<text x="30.0" y="712.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">On Ascend the attention call is replaced (npu_ops/vit_attn.py).</text>
<text x="30.0" y="730.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">The concat order inside one 3 x 3 block follows F.unfold in the reference function (image_embed_ops.py:577-580).</text>
</svg>
