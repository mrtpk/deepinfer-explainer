<rect x="108.0" y="424.0" width="58.0" height="30.0" rx="4" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="137.0" y="444.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">g1</text>
<rect x="170.0" y="424.0" width="58.0" height="30.0" rx="4" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="199.0" y="444.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">g2</text>
<rect x="232.0" y="424.0" width="58.0" height="30.0" rx="4" fill="#f5f3ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.3"/>
<text x="261.0" y="444.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">g3</text>
<text x="304.0" y="444.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">→ 4 groups of 32 values = 128 values of K</text>
<text x="46.0" y="490.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="bold" text-anchor="start" xml:space="preserve" style="white-space:pre">Ascend: one int16 = 2 scale bytes (platform.py:138)</text>
<rect x="46.0" y="500.0" width="58.0" height="30.0" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="75.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">g0</text>
<rect x="108.0" y="500.0" width="58.0" height="30.0" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#059669" stroke-width="1.3"/>
<text x="137.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle" xml:space="preserve" style="white-space:pre">g1</text>
<text x="180.0" y="520.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#111827" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre">→ 2 groups of 32 values = 64 values of K</text>
<text x="640.0" y="476.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre" font-style="italic">Expert scales: sf_pack_granularity = 32 × itemsize</text>
<text x="640.0" y="494.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start" xml:space="preserve" style="white-space:pre" font-style="italic">= 128 (int32) or 64 (int16) values (containers.py:80)</text>
<rect x="20.0" y="580.0" width="1060.0" height="206.0" rx="14" fill="#fafafa" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
